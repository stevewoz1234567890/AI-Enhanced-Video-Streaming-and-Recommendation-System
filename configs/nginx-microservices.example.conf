# Route modular HTTP APIs to multiple control-plane replicas (same image, horizontal scale).
# Pair with: docker compose up --scale backend=3
# Upstream members should match your compose service name and internal port.

upstream streaming_api {
    least_conn;
    server backend:8000;
    # With docker compose --scale backend=N, use a custom network alias or external LB;
    # this example assumes a single service DNS name that resolves to all replicas.
}

server {
    listen 8088;
    server_name _;

    location / {
        proxy_pass http://streaming_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
    }
}
