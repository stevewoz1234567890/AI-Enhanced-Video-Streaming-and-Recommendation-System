# NGINX: cache hot segments and proxy to origin; pair with HAProxy for LB upstreams.
proxy_cache_path /var/cache/nginx/streaming levels=1:2 keys_zone=STREAM:100m inactive=7d max_size=20g;

upstream origin_app {
    server backend:8000;
}

server {
    listen 8080;
    server_name _;

    location /hls/ {
        proxy_cache STREAM;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass http://origin_app/;
    }

    location /api/ {
        proxy_pass http://origin_app/;
    }
}
