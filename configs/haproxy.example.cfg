global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    timeout connect 5s
    timeout client  60s
    timeout server  60s

frontend fe_stream    bind *:80
    default_backend be_api

backend be_api
    balance roundrobin
    option httpchk GET /health
    server s1 backend:8000 check
    # server s2 backend2:8000 check
